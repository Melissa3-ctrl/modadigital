<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar novo membro membro</title> 
    <style>
    body{font-family:Arial, sans-serif; margin: 20;}
    form{max-width: 400px; margin: 20px 0;}
    label{display: block;margin-top: 10px; font-weight: bold;}
    input{width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;}
    .btn{padding: 10px 20px; text-decoration:none; border-radius: 4px; border: none; cursor: pointer;}
    .btn-save { background-color: #4CAF50; color: white; } 
    .btn-cancel { background-color: #f44336; color: white; } 
    .error { color: red; font-size: 14px; } </style>
    </style>
    </head> 
    <body> 
        <h1>Criar Novo Membro</h1> 
        <!-- FORMULÁRIO --> 
         <!-- method="POST" = enviar dados --> 
         <!-- {% csrf_token %} = proteção de segurança (obrigatório) --> 
          <form method="POST"> {% csrf_token %} 
            <!-- PARA CADA CAMPO do formulário --> 
             {% for field in form %} <div> <!-- Mostra a etiqueta (ex: "Primeiro Nome") -->
                 {{ field.label_tag }}
                 <!-- Mostra o campo (ex: caixa de texto) --> 
                  {{ field }} <!-- Mostra erros se houver --> {% if field.errors %} <div class="error">
                    {{ field.errors }}</div> 
                    {% endif %} </div> {% endfor %} <br> 
                    <!-- BOTÃO SALVAR --> 
                     <button type="submit" class="btn btn-save"> 
                        💾 Salvar</button> 
                        <!-- BOTÃO CANCELAR -->
                         <a href="{% url 'listar_membros' %}" class="btn btn-cancel"> 
                            ❌ C ancelar</a> 
                        </form> 
                    </body> 
                    </html>
