<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel com 3 Imagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="slides">
                <!-- Slide 1 -->
                <div class="slide">
                   <img src="{% static 'img/bolsa.jpg' %}" alt="Foto 1"> 
                </div>
                
                <!-- Slide 2 -->
                <div class="slide">
                    <img src="C:\Users\melissa64885286\Documents\dev1\modadigital\membros\static\img\saltoo.jpg" alt="Imagem 2">
                </div>
                
                <!-- Slide 3 -->
                <div class="slide">
                    <img src="C:\Users\melissa64885286\Documents\dev1\modadigital\membros\static\img\bolsa.jpg" alt="Imagem 3">
                </div>
            </div>
            
            <!-- Botões de navegação -->
            <button class="prev" onclick="prevSlide()">❮</button>
            <button class="next" onclick="nextSlide()">❯</button>
        </div>
        
        <!-- Indicadores (dots) -->
        <div class="dots-container">
            <span class="dot" onclick="currentSlide(0)"></span>
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
